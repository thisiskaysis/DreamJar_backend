<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .table-box { fill: white; stroke: #2563eb; stroke-width: 2; }
      .table-header { fill: #2563eb; }
      .table-title { fill: white; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; }
      .field-text { font-family: 'Courier New', monospace; font-size: 14px; fill: #1e293b; }
      .field-type { font-family: 'Courier New', monospace; font-size: 12px; fill: #64748b; }
      .pk { fill: #fbbf24; font-weight: bold; }
      .fk { fill: #3b82f6; font-weight: bold; }
      .relationship-line { stroke: #475569; stroke-width: 2; fill: none; }
      .relationship-text { font-family: Arial, sans-serif; font-size: 12px; fill: #475569; font-weight: bold; }
    </style>
  </defs>

  <!-- Parent (User) Table -->
  <g id="parent-table">
    <rect class="table-box" x="50" y="50" width="280" height="280" rx="8"/>
    <rect class="table-header" x="50" y="50" width="280" height="40" rx="8"/>
    <text class="table-title" x="190" y="77" text-anchor="middle">Parent (User)</text>
    
    <text class="field-text pk" x="65" y="110">PK</text>
    <text class="field-text" x="100" y="110">id</text>
    <text class="field-type" x="250" y="110">Integer</text>
    
    <text class="field-text" x="65" y="135">username</text>
    <text class="field-type" x="250" y="135">CharField</text>
    
    <text class="field-text" x="65" y="160">email</text>
    <text class="field-type" x="250" y="160">EmailField</text>
    
    <text class="field-text" x="65" y="185">password</text>
    <text class="field-type" x="250" y="185">CharField</text>
    
    <text class="field-text" x="65" y="210">first_name</text>
    <text class="field-type" x="250" y="210">CharField</text>
    
    <text class="field-text" x="65" y="235">last_name</text>
    <text class="field-type" x="250" y="235">CharField</text>
    
    <text class="field-text" x="65" y="260">is_active</text>
    <text class="field-type" x="250" y="260">Boolean</text>
    
    <text class="field-text" x="65" y="285">is_staff</text>
    <text class="field-type" x="250" y="285">Boolean</text>
    
    <text class="field-text" x="65" y="310">date_joined</text>
    <text class="field-type" x="250" y="310">DateTime</text>
  </g>

  <!-- Child Table -->
  <g id="child-table">
    <rect class="table-box" x="470" y="50" width="280" height="200" rx="8"/>
    <rect class="table-header" x="470" y="50" width="280" height="40" rx="8"/>
    <text class="table-title" x="610" y="77" text-anchor="middle">Child</text>
    
    <text class="field-text pk" x="485" y="110">PK</text>
    <text class="field-text" x="520" y="110">id</text>
    <text class="field-type" x="680" y="110">Integer</text>
    
    <text class="field-text" x="485" y="135">name</text>
    <text class="field-type" x="680" y="135">CharField</text>
    
    <text class="field-text" x="485" y="160">date_of_birth</text>
    <text class="field-type" x="680" y="160">DateField</text>
    
    <text class="field-text" x="485" y="185">profile_picture</text>
    <text class="field-type" x="680" y="185">URLField</text>
    
    <text class="field-text fk" x="485" y="210">FK</text>
    <text class="field-text" x="520" y="210">parent_id</text>
    <text class="field-type" x="680" y="210">Integer</text>
    
    <text class="field-text" x="485" y="230" font-size="11" fill="#64748b">→ Parent.id</text>
  </g>

  <!-- Campaign Table -->
  <g id="campaign-table">
    <rect class="table-box" x="470" y="310" width="280" height="380" rx="8"/>
    <rect class="table-header" x="470" y="310" width="280" height="40" rx="8"/>
    <text class="table-title" x="610" y="337" text-anchor="middle">Campaign (DreamJar)</text>
    
    <text class="field-text pk" x="485" y="370">PK</text>
    <text class="field-text" x="520" y="370">id</text>
    <text class="field-type" x="680" y="370">Integer</text>
    
    <text class="field-text" x="485" y="395">title</text>
    <text class="field-type" x="680" y="395">CharField</text>
    
    <text class="field-text" x="485" y="420">description</text>
    <text class="field-type" x="680" y="420">TextField</text>
    
    <text class="field-text" x="485" y="445">goal</text>
    <text class="field-type" x="680" y="445">Integer</text>
    
    <text class="field-text" x="485" y="470">image</text>
    <text class="field-type" x="680" y="470">URLField</text>
    
    <text class="field-text" x="485" y="495">is_open</text>
    <text class="field-type" x="680" y="495">Boolean</text>
    
    <text class="field-text" x="485" y="520">date_created</text>
    <text class="field-type" x="680" y="520">DateTime</text>
    
    <text class="field-text" x="485" y="545">category</text>
    <text class="field-type" x="680" y="545">CharField</text>
    
    <text class="field-text" x="485" y="570">has_deadline</text>
    <text class="field-type" x="680" y="570">Boolean</text>
    
    <text class="field-text" x="485" y="595">deadline</text>
    <text class="field-type" x="680" y="595">DateTime</text>
    
    <text class="field-text fk" x="485" y="620">FK</text>
    <text class="field-text" x="520" y="620">child_id</text>
    <text class="field-type" x="680" y="620">Integer</text>
    
    <text class="field-text" x="485" y="640" font-size="11" fill="#64748b">→ Child.id</text>
    
    <text class="field-text" x="485" y="665" font-size="11" fill="#059669" font-style="italic">@property total_raised</text>
    <text class="field-text" x="485" y="680" font-size="11" fill="#059669" font-style="italic">@property percentage_raised</text>
  </g>

  <!-- Donation Table -->
  <g id="donation-table">
    <rect class="table-box" x="870" y="310" width="280" height="330" rx="8"/>
    <rect class="table-header" x="870" y="310" width="280" height="40" rx="8"/>
    <text class="table-title" x="1010" y="337" text-anchor="middle">Donation</text>
    
    <text class="field-text pk" x="885" y="370">PK</text>
    <text class="field-text" x="920" y="370">id</text>
    <text class="field-type" x="1080" y="370">Integer</text>
    
    <text class="field-text" x="885" y="395">amount</text>
    <text class="field-type" x="1080" y="395">Integer</text>
    
    <text class="field-text" x="885" y="420">comment</text>
    <text class="field-type" x="1080" y="420">CharField</text>
    
    <text class="field-text" x="885" y="445">anonymous</text>
    <text class="field-type" x="1080" y="445">Boolean</text>
    
    <text class="field-text" x="885" y="470">date_donated</text>
    <text class="field-type" x="1080" y="470">DateTime</text>
    
    <text class="field-text" x="885" y="495">donor_name</text>
    <text class="field-type" x="1080" y="495">CharField</text>
    
    <text class="field-text" x="885" y="520">donor_email</text>
    <text class="field-type" x="1080" y="520">EmailField</text>
    
    <text class="field-text fk" x="885" y="545">FK</text>
    <text class="field-text" x="920" y="545">campaign_id</text>
    <text class="field-type" x="1080" y="545">Integer</text>
    
    <text class="field-text" x="885" y="565" font-size="11" fill="#64748b">→ Campaign.id</text>
    
    <text class="field-text fk" x="885" y="590">FK</text>
    <text class="field-text" x="920" y="590">donor_id</text>
    <text class="field-type" x="1080" y="590">Integer</text>
    
    <text class="field-text" x="885" y="610" font-size="11" fill="#64748b">→ Parent.id (nullable)</text>
  </g>

  <!-- Relationships -->
  <!-- Parent to Child (1:N) -->
  <path class="relationship-line" d="M 330 150 L 470 150" marker-end="url(#arrowhead)"/>
  <circle cx="330" cy="150" r="4" fill="#475569"/>
  <text class="relationship-text" x="380" y="140">1</text>
  <text class="relationship-text" x="450" y="140">N</text>

  <!-- Child to Campaign (1:N) -->
  <path class="relationship-line" d="M 610 250 L 610 310"/>
  <circle cx="610" cy="250" r="4" fill="#475569"/>
  <text class="relationship-text" x="620" y="270">1</text>
  <text class="relationship-text" x="620" y="305">N</text>

  <!-- Campaign to Donation (1:N) -->
  <path class="relationship-line" d="M 750 500 L 870 500"/>
  <circle cx="750" cy="500" r="4" fill="#475569"/>
  <text class="relationship-text" x="790" y="490">1</text>
  <text class="relationship-text" x="850" y="490">N</text>

  <!-- Parent to Donation (1:N, optional) -->
  <path class="relationship-line" d="M 190 330 L 190 720 L 870 720 L 870 590" stroke-dasharray="5,5"/>
  <circle cx="190" cy="330" r="4" fill="#475569"/>
  <text class="relationship-text" x="200" y="350">1</text>
  <text class="relationship-text" x="850" y="710">0..N</text>
  <text class="relationship-text" x="500" y="735" fill="#64748b">(optional - for authenticated donors)</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="400" width="200" height="120" fill="white" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="150" y="425" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">Legend</text>
    
    <text class="field-text pk" x="65" y="450">PK</text>
    <text class="field-text" x="100" y="450">Primary Key</text>
    
    <text class="field-text fk" x="65" y="475">FK</text>
    <text class="field-text" x="100" y="475">Foreign Key</text>
    
    <line x1="65" y1="490" x2="95" y2="490" stroke="#475569" stroke-width="2"/>
    <text class="field-text" x="100" y="495">Relationship</text>
    
    <line x1="65" y1="505" x2="95" y2="505" stroke="#475569" stroke-width="2" stroke-dasharray="5,5"/>
    <text class="field-text" x="100" y="510" font-size="12">Optional</text>
  </g>
</svg>